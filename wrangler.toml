# Cruise Shoppers — Cloudflare Worker + static assets + D1
#
# Deploy model: this repo auto-deploys from GitHub `main` via Cloudflare
# Workers Builds (same pattern as your other sites). Wrangler is only used by
# Cloudflare's build; you do not need Node installed locally.

name = "cruiseshoppers"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Static site files (HTML/CSS/JS) served at the edge.
# run_worker_first = true is REQUIRED: it forces every request through the
# Worker (which then serves assets via the ASSETS binding) so the auth gate on
# /app and /quote actually runs. Without it, Cloudflare serves those HTML files
# directly and the gate is bypassed.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 (SQLite) database for users, sessions, and password-reset tokens.
# After running `wrangler d1 create cruiseshoppers` (or creating it in the
# Cloudflare dashboard), paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "cruiseshoppers"
database_id = "9a9dbdcc-95f0-49af-8490-c60ffd3b2933"

# Workers AI: runs an LLM inside the Worker (env.AI) for the cruise concierge.
# No external key; billed in the account's Workers AI free allocation, then
# fractions of a cent per call. Enabled automatically once this binding deploys.
[ai]
binding = "AI"

# Non-secret config. Secrets (WIDGETY_APP_ID, WIDGETY_TOKEN, RESEND_API_KEY,
# SESSION_SECRET) are set separately via `wrangler secret put` or the
# Cloudflare dashboard — never commit them.
[vars]
APP_URL = "https://cruiseshoppers.com"
MAIL_FROM = "Cruise Shoppers <noreply@cruiseshoppers.com>"
SESSION_TTL_DAYS = "30"
RESET_TTL_MINUTES = "60"
