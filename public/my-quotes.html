<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Quotes | CruiseShoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header app-header">
    <div class="container bar">
      <a class="brand" href="/app"><img src="/img/logo.png" alt="CruiseShoppers" class="logo" /></a>
      <nav class="nav" id="accountNav"></nav>
    </div>
  </header>

  <main class="catalog">
    <div class="container">
      <div class="catalog-top">
        <div>
          <h1>My quotes</h1>
          <div class="count" id="count">Loading your quotes…</div>
        </div>
      </div>
      <div id="results"><div class="state"><div class="spinner"></div>Loading your quotes…</div></div>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script src="/js/thread.js"></script>
  <script src="/js/my-quotes.js"></script>
</body>
</html>
