<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password | CruiseShoppers</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.svg" alt="CruiseShoppers" class="logo" /></a>
      <nav class="nav"><a href="/login">Log in</a></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="muted">Enter your email and we'll send you a link to reset it.</p>
      <div class="alert hidden" id="alert"></div>
      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Send reset link</button>
      </form>
      <p class="auth-alt"><a href="/login">Back to log in</a></p>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Sending…';

      const { data } = await api('/api/auth/forgot', {
        method: 'POST',
        body: { email: document.getElementById('email').value },
      });

      // Always a generic success (no account enumeration).
      showAlert(alertEl, 'success', data.message || 'If that email has an account, a reset link is on its way.');
      document.getElementById('forgotForm').reset();
      btn.disabled = false; btn.textContent = 'Send reset link';
    });
  </script>
</body>
</html>
