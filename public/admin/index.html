<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advisor Approvals | Cruise Shoppers Admin</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header app-header">
    <div class="container bar">
      <a class="brand" href="/admin"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav" id="accountNav"></nav>
    </div>
  </header>

  <main class="catalog">
    <div class="container">
      <nav class="admin-subnav">
        <a href="/admin" class="is-active">Advisors</a>
        <a href="/admin/clients">Clients</a>
        <a href="/admin/requests">Requests</a>
        <a href="/admin/quotes">Quotes</a>
        <a href="/admin/specials">Specials</a>
        <a href="/admin/bookings">Bookings</a>
        <a href="/admin/reports">Reports</a>
        <a href="/admin/reviews">Reviews</a>
        <a href="/admin/admins">Admins</a>
        <a href="/admin/neptune">Neptune</a>
      </nav>
      <div class="catalog-top">
        <div>
          <h1>Advisors</h1>
          <div class="count" id="count">Loading advisors…</div>
        </div>
        <div class="role-badge">Admin</div>
      </div>

      <div class="admin-toolbar">
        <button type="button" class="btn btn-primary btn-sm" id="addAgencyBtn">+ Add agency</button>
        <button type="button" class="btn btn-ghost btn-sm" id="addSeatBtn">+ Add advisor to an agency</button>
      </div>
      <div id="adminForm"></div>

      <div class="admin-tabs" id="tabs">
        <button type="button" class="tab is-active" data-filter="all">All</button>
        <button type="button" class="tab" data-filter="pending">Pending</button>
        <button type="button" class="tab" data-filter="active">Approved</button>
        <button type="button" class="tab" data-filter="declined">Declined</button>
        <button type="button" class="tab" data-filter="suspended">Suspended</button>
      </div>

      <div id="results"><div class="state"><div class="spinner"></div>Loading advisors…</div></div>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-view.js"></script>
</body>
</html>
