<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admins | Cruise Shoppers Admin</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header app-header">
    <div class="container bar">
      <a class="brand" href="/admin"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav" id="accountNav"></nav>
    </div>
  </header>

  <main class="catalog">
    <div class="container">
      <nav class="admin-subnav">
        <a href="/admin">Advisors</a>
        <a href="/admin/clients">Clients</a>
        <a href="/admin/requests">Requests</a>
        <a href="/admin/quotes">Quotes</a>
        <a href="/admin/bookings">Bookings</a>
        <a href="/admin/reviews">Reviews</a>
        <a href="/admin/admins" class="is-active">Admins</a>
        <a href="/admin/neptune">Neptune</a>
      </nav>
      <div class="catalog-top">
        <div>
          <h1>Admins</h1>
          <div class="count" id="count">Loading admins…</div>
        </div>
        <div class="role-badge">Admin</div>
      </div>

      <p class="form-note" id="hint"></p>

      <div class="admin-panel">
        <h2 class="form-section" style="margin-top:0;">Add an admin</h2>
        <div class="alert hidden" id="addAlert"></div>
        <form id="addAdminForm" novalidate>
          <div class="row-2">
            <div class="field"><label for="a_first">First name</label><input type="text" id="a_first" autocomplete="off" required /></div>
            <div class="field"><label for="a_last">Last name</label><input type="text" id="a_last" autocomplete="off" /></div>
          </div>
          <div class="row-2">
            <div class="field"><label for="a_email">Email</label><input type="email" id="a_email" autocomplete="off" required /></div>
            <div class="field"><label for="a_pass">Temporary password</label><input type="text" id="a_pass" autocomplete="off" placeholder="At least 8 characters" required /><div class="hint">Shared with the new admin by email. They should change it after first sign-in.</div></div>
          </div>
          <button type="submit" class="btn btn-navy" id="addBtn">Add admin</button>
        </form>
      </div>

      <div id="results"><div class="state"><div class="spinner"></div>Loading admins…</div></div>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script src="/js/admin-admins.js"></script>
</body>
</html>
