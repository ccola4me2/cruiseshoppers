<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admins | CruiseShoppers Admin</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header app-header">
    <div class="container bar">
      <a class="brand" href="/admin"><img src="/img/logo.png" alt="CruiseShoppers" class="logo" /></a>
      <nav class="nav" id="accountNav"></nav>
    </div>
  </header>

  <main class="catalog">
    <div class="container">
      <nav class="admin-subnav">
        <a href="/admin">Advisor approvals</a>
        <a href="/admin/clients">Clients</a>
        <a href="/admin/requests">Requests</a>
        <a href="/admin/quotes">Quotes</a>
        <a href="/admin/admins" class="is-active">Admins</a>
      </nav>
      <div class="catalog-top">
        <div>
          <h1>Admins</h1>
          <div class="count" id="count">Loading admins…</div>
        </div>
        <div class="role-badge">Admin</div>
      </div>

      <p class="form-note" id="hint"></p>
      <div id="results"><div class="state"><div class="spinner"></div>Loading admins…</div></div>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script src="/js/admin-admins.js"></script>
</body>
</html>
