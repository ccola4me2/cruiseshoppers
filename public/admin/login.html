<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | CruiseShoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.png" alt="CruiseShoppers" class="logo" /></a>
      <nav class="nav"><a href="/">Back to site</a></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="role-badge">Admin</div>
      <h1>Admin sign in</h1>
      <p class="muted">Restricted area. Sign in with an administrator account to manage clients and advisors.</p>
      <div class="alert hidden" id="alert"></div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <div class="forgot-link"><a href="/forgot-password">Forgot your password?</a></div>
        <button type="submit" class="btn btn-navy btn-block btn-lg" id="submitBtn">Sign in</button>
      </form>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    const homeFor = (u) => u.role === 'admin' ? '/admin'
      : u.role === 'advisor' ? (u.status === 'active' ? '/advisor' : '/advisor/pending')
      : '/app';

    (async () => {
      const u = await getMe();
      if (u && u.role === 'admin') { window.location.href = '/admin'; }
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      const { ok, data } = await api('/api/auth/login', {
        method: 'POST',
        body: { email: document.getElementById('email').value, password: document.getElementById('password').value },
      });
      if (ok) {
        const u = data.user || {};
        if (u.role === 'admin') {
          window.location.href = '/admin';
        } else {
          // Valid account, but not an administrator.
          showAlert(alertEl, 'error', 'That account does not have admin access.');
          btn.disabled = false; btn.textContent = 'Sign in';
        }
      } else {
        showAlert(alertEl, 'error', data.message || 'Unable to sign in. Please try again.');
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
