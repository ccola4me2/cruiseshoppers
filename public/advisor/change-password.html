<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Your Password | Cruise Shoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav"><a href="#" id="logoutLink">Sign out</a></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="role-badge">Travel Advisor</div>
      <h1>Set your password</h1>
      <p class="muted">Welcome<span id="nm"></span>! You signed in with a temporary password. Choose your own password to finish setting up your account.</p>
      <div class="alert hidden" id="alert"></div>
      <form id="pwForm" novalidate>
        <div class="field"><label for="password">New password</label><input type="password" id="password" autocomplete="new-password" required /><div class="hint">At least 8 characters.</div></div>
        <div class="field"><label for="password2">Confirm new password</label><input type="password" id="password2" autocomplete="new-password" required /></div>
        <button type="submit" class="btn btn-navy btn-block btn-lg" id="submitBtn">Save password &amp; continue</button>
      </form>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    (async () => {
      const u = await getMe();
      if (!u) { window.location.href = '/advisor/login?next=/advisor/change-password'; return; }
      if (u.role === 'admin') { window.location.href = '/admin'; return; }
      if (u.role !== 'advisor') { window.location.href = '/app'; return; }
      // If they no longer need to change it, don't strand them here.
      if (!u.must_change_password) { window.location.href = '/advisor'; return; }
      document.getElementById('nm').textContent = u.first_name ? `, ${u.first_name}` : '';
    })();

    document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); logout(); });

    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const pw = document.getElementById('password').value;
      const pw2 = document.getElementById('password2').value;
      if (pw.length < 8) { showAlert(alertEl, 'error', 'Password must be at least 8 characters.'); return; }
      if (pw !== pw2) { showAlert(alertEl, 'error', 'The passwords do not match.'); return; }
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      const { ok, data } = await api('/api/auth/change-password', { method: 'POST', body: { new_password: pw } });
      if (ok) {
        window.location.href = '/advisor';
      } else {
        showAlert(alertEl, 'error', (data && data.message) || 'Could not save your password. Please try again.');
        btn.disabled = false; btn.textContent = 'Save password & continue';
      }
    });
  </script>
</body>
</html>
