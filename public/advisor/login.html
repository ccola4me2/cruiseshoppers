<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advisor Login | CruiseShoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.png" alt="CruiseShoppers" class="logo" /></a>
      <nav class="nav"><a href="/for-advisors" class="hide-sm">Learn more</a><a href="/login">Client login</a></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="role-badge">Travel Advisor Portal</div>
      <h1>Advisor login</h1>
      <p class="muted">Log in to view and respond to client quote requests.</p>
      <div class="alert hidden" id="alert"></div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <div class="forgot-link"><a href="/forgot-password">Forgot your password?</a></div>
        <button type="submit" class="btn btn-navy btn-block btn-lg" id="submitBtn">Log in</button>
      </form>
      <p class="auth-alt">New advisor? <a href="/advisor/signup">Apply to join</a> &nbsp;·&nbsp; <a href="/for-advisors">Learn more</a></p>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    (async () => { const u = await getMe(); if (u) window.location.href = u.role === 'advisor' ? '/advisor' : '/app'; })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Logging in…';
      const { ok, data } = await api('/api/auth/login', {
        method: 'POST',
        body: { email: document.getElementById('email').value, password: document.getElementById('password').value },
      });
      if (ok) {
        window.location.href = data.user && data.user.role === 'advisor' ? '/advisor' : '/app';
      } else {
        showAlert(alertEl, 'error', data.message || 'Unable to log in. Please try again.');
        btn.disabled = false; btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
