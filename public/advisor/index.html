<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advisor Dashboard | Cruise Shoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header app-header">
    <div class="container bar">
      <a class="brand" href="/advisor"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav" id="accountNav"></nav>
    </div>
  </header>

  <main class="catalog">
    <div class="container">
      <div class="catalog-top">
        <div>
          <h1 id="pageTitle">Quote requests</h1>
          <div class="count" id="count">Loading…</div>
        </div>
        <div class="role-badge">Travel Advisor Portal</div>
      </div>

      <section class="asp" id="specialsPanel" hidden>
        <div class="asp-head">
          <h2 class="asp-title">Your specials</h2>
          <a href="/advisor/specials" class="btn btn-navy btn-sm">Manage specials</a>
        </div>
        <div id="specialsPanelBody"></div>
      </section>

      <div class="admin-tabs" id="tabs">
        <button type="button" class="tab is-active" data-tab="open">Open quotes</button>
        <button type="button" class="tab" data-tab="submitted">Submitted quotes</button>
        <button type="button" class="tab" data-tab="closed">Closed quotes</button>
      </div>

      <div class="filters" id="filters" style="grid-template-columns: 2fr 1fr auto;">
        <div class="field">
          <label for="q">Search</label>
          <input type="search" id="q" placeholder="Client, ship, destination…" />
        </div>
        <div class="field">
          <label for="line">Cruise line</label>
          <select id="line"><option value="">All lines</option></select>
        </div>
        <button type="button" class="btn btn-ghost" id="resetFilters">Reset</button>
      </div>

      <div id="results"><div class="state"><div class="spinner"></div>Loading leads…</div></div>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script src="/js/thread.js"></script>
  <script src="/js/advisor.js"></script>
</body>
</html>
