<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 72" role="img" aria-label="CruiseShoppers - Search, Compare, Save, Sail">
  <!-- Mark: crescent + sparkles + cruise ship on waves -->
  <g>
    <!-- gold crescent arc over the ship -->
    <path d="M9 33 A27 27 0 0 1 57 17" fill="none" stroke="#d9a441" stroke-width="3.4" stroke-linecap="round"/>
    <!-- sparkle stars -->
    <path d="M58 10 L59.6 13.4 L63 15 L59.6 16.6 L58 20 L56.4 16.6 L53 15 L56.4 13.4 Z" fill="#d9a441"/>
    <path d="M65 20 L65.9 22.1 L68 23 L65.9 23.9 L65 26 L64.1 23.9 L62 23 L64.1 22.1 Z" fill="#d9a441"/>
    <path d="M50 8 L50.8 9.9 L52.7 10.7 L50.8 11.5 L50 13.4 L49.2 11.5 L47.3 10.7 L49.2 9.9 Z" fill="#d9a441"/>
    <!-- ship hull -->
    <path d="M11 45 L57 45 L50.5 53 L17.5 53 Z" fill="#0b3a66"/>
    <!-- superstructure -->
    <rect x="17" y="32" width="34" height="13" rx="1.5" fill="#ffffff" stroke="#0b3a66" stroke-width="1.6"/>
    <circle cx="23" cy="38.5" r="1.4" fill="#0b3a66"/>
    <circle cx="29" cy="38.5" r="1.4" fill="#0b3a66"/>
    <circle cx="35" cy="38.5" r="1.4" fill="#0b3a66"/>
    <circle cx="41" cy="38.5" r="1.4" fill="#0b3a66"/>
    <!-- bridge deck -->
    <rect x="25" y="25" width="17" height="7.5" rx="1.5" fill="#ffffff" stroke="#0b3a66" stroke-width="1.6"/>
    <!-- funnel -->
    <rect x="43.5" y="21" width="5.5" height="6.5" rx="1" fill="#0e8ea6"/>
    <!-- waves -->
    <path d="M7 55 q7 -5 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#0e8ea6" stroke-width="3" stroke-linecap="round"/>
    <path d="M7 61 q7 -5 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#0b3a66" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="0.4">
    <tspan fill="#0b3a66">CRUISE</tspan><tspan fill="#0e8ea6"> SHOPPERS</tspan>
  </text>
  <!-- gold divider -->
  <line x1="82" y1="48" x2="388" y2="48" stroke="#d9a441" stroke-width="1.1" opacity="0.85"/>
  <!-- tagline -->
  <text x="82" y="61" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600" letter-spacing="3.4" fill="#0b3a66">SEARCH · COMPARE · SAVE · SAIL</text>
</svg>
