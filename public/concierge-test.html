<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concierge spike | Cruise Shoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .spike { max-width: 820px; margin: 0 auto; padding: 32px 20px 72px; }
    .spike h1 { color: var(--navy); font-family: var(--font-head); }
    .spike .muted { color: var(--muted); }
    .spike-bar { display: flex; gap: 10px; margin: 18px 0 6px; }
    .spike-bar input { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 1rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 20px; }
    .chip { background: var(--surface-alt); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; color: var(--ink-soft); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 16px; box-shadow: var(--shadow-sm); }
    .panel h3 { margin: 0 0 8px; font-size: 0.95rem; color: var(--navy); }
    pre { background: var(--surface-alt); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 0.85rem; margin: 0; }
    .match { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
    .match:first-child { border-top: 0; }
    .match .m-main { font-weight: 600; color: var(--navy); }
    .match .m-sub { font-size: 0.85rem; color: var(--muted); }
    .match .m-when { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="spike">
    <h1>AI concierge — spike</h1>
    <p class="muted">Type a cruise request in plain English. The Worker uses Cloudflare Workers AI to turn it into filters, then matches our catalog. You must be logged in.</p>

    <div class="spike-bar">
      <input id="q" type="text" placeholder="e.g. warm-weather 7 night cruise out of Florida in March, we like Royal Caribbean" />
      <button id="go" class="btn btn-primary">Find</button>
    </div>
    <div class="chips" id="samples"></div>

    <div id="out"></div>
  </div>

  <script src="/js/auth-client.js"></script>
  <script>
    const SAMPLES = [
      'a relaxing 7 night Caribbean cruise in February',
      'Alaska in the summer, about a week, on Royal Caribbean',
      'short 3-4 night getaway to the Bahamas',
      'Mediterranean cruise next spring, 10 nights or so',
      'river cruise in Europe',
    ];
    const samplesEl = document.getElementById('samples');
    SAMPLES.forEach((s) => {
      const c = document.createElement('span');
      c.className = 'chip'; c.textContent = s;
      c.onclick = () => { document.getElementById('q').value = s; run(); };
      samplesEl.appendChild(c);
    });

    const out = document.getElementById('out');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function run() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      out.innerHTML = '<div class="panel muted">Thinking…</div>';
      let res, data;
      try {
        res = await fetch('/api/concierge', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q }),
        });
        data = await res.json();
      } catch (e) {
        out.innerHTML = '<div class="panel">Network error: ' + esc(e) + '</div>';
        return;
      }
      if (res.status === 401) {
        out.innerHTML = '<div class="panel">You need to be logged in. <a href="/login?next=/concierge-test">Log in</a>, then come back.</div>';
        return;
      }
      if (!res.ok && !data) {
        out.innerHTML = '<div class="panel">Error ' + res.status + '</div>';
        return;
      }
      const price = (m) => m.price_amount != null ? ('from $' + Number(m.price_amount).toLocaleString() + (m.price_currency && m.price_currency !== 'USD' ? ' ' + m.price_currency : '')) : '';
      const matches = (data.matches || []).map((m) => `
        <div class="match">
          <div><div class="m-main">${esc(m.name || m.ship || 'Cruise')}</div>
          <div class="m-sub">${esc([m.line, m.ship, m.departure_port, m.destination, m.nights ? m.nights + ' nights' : '', price(m)].filter(Boolean).join(' · '))}</div></div>
          <div class="m-when">${esc(m.depart_date || '')}</div>
        </div>`).join('') || '<div class="muted">No catalog matches for those filters.</div>';

      out.innerHTML = `
        <div class="panel"><h3>Parsed filters</h3><pre>${esc(JSON.stringify(data.filters || {}, null, 2))}</pre>
          ${data.ai_error ? '<p class="muted">AI note: ' + esc(data.ai_error) + '</p>' : ''}</div>
        <div class="panel"><h3>Matches (${data.count || 0}) · source: ${esc(data.source || '—')}</h3>
          ${data.match_error ? '<p class="muted">Match note: ' + esc(data.match_error) + '</p>' : ''}${matches}</div>
        <details class="panel"><summary class="muted">Raw model output</summary><pre>${esc(data.ai_raw || '')}</pre></details>`;
    }

    document.getElementById('go').onclick = run;
    document.getElementById('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
  </script>
</body>
</html>
