<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a new password | Cruise Shoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav"><a href="/login">Log in</a></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Choose a new password</h1>
      <p class="muted">Enter a new password for your account.</p>
      <div class="alert hidden" id="alert"></div>
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <div class="hint">At least 8 characters.</div>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Reset password</button>
      </form>
      <p class="auth-alt" id="loginLink" style="display:none;"><a href="/login">Continue to log in</a></p>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    const token = new URLSearchParams(location.search).get('token') || '';

    if (!token) {
      showAlert(alertEl, 'error', 'This reset link is missing its token. Please request a new one.');
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('loginLink').style.display = 'block';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const pw = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (pw !== confirm) { showAlert(alertEl, 'error', 'Passwords do not match.'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Resetting…';

      const { ok, data } = await api('/api/auth/reset', {
        method: 'POST',
        body: { token, password: pw },
      });

      if (ok) {
        showAlert(alertEl, 'success', data.message || 'Your password has been reset.');
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('loginLink').style.display = 'block';
      } else {
        showAlert(alertEl, 'error', data.message || 'Unable to reset your password. The link may have expired.');
        btn.disabled = false; btn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
