<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request a Quote | Cruise Shoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header app-header">
    <div class="container bar">
      <a class="brand" href="/app"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav" id="accountNav"></nav>
    </div>
  </header>

  <main class="quote-wrap">
    <div class="container">
      <p style="margin:0 0 18px;"><a href="/app">← Back to sailings</a></p>
      <div class="quote-grid">
        <aside class="summary-card" id="summary">
          <h2>Your selected sailing</h2>
          <div class="ship" id="sumShip"></div>
          <div id="sumMeta"></div>
        </aside>

        <section>
          <h1 style="font-family:var(--font-head);color:var(--navy);margin:0 0 6px;">Request your personalized quote</h1>
          <p style="color:var(--ink-soft);margin:0 0 18px;">
            Your details and sailing selection are pre-filled below. A cruise specialist will
            follow up with pricing and options. No obligation.
          </p>
          <div class="quote-embed" id="embed">
            <div class="state"><div class="spinner"></div>Preparing your quote form…</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script src="/js/quote.js"></script>
</body>
</html>
