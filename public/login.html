<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in | CruiseShoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.png" alt="CruiseShoppers" class="logo" /></a>
      <nav class="nav"><a href="/signup">Sign up</a></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to browse sailings and request quotes.</p>
      <div class="alert hidden" id="alert"></div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <div class="forgot-link"><a href="/forgot-password">Forgot your password?</a></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Log in</button>
      </form>
      <p class="auth-alt">New to CruiseShoppers? <a href="/signup">Create a free account</a></p>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    redirectIfAuthed();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Logging in…';

      const { ok, data } = await api('/api/auth/login', {
        method: 'POST',
        body: {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        },
      });

      if (ok) {
        const next = new URLSearchParams(location.search).get('next');
        const u = data.user || {};
        const home = u.role === 'admin' ? '/admin'
          : u.role === 'advisor' ? (u.status === 'active' ? '/advisor' : '/advisor/pending')
          : '/app';
        window.location.href = next && next.startsWith('/') ? next : home;
      } else {
        showAlert(alertEl, 'error', data.message || 'Unable to log in. Please try again.');
        btn.disabled = false; btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
