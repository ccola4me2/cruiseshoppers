<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create your free account | Cruise Shoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav"><a href="/login">Log in</a></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="muted">Free to join. Unlock the full sailings catalog in seconds.</p>
      <div class="alert hidden" id="alert"></div>
      <form id="signupForm" novalidate>
        <div class="row-2">
          <div class="field">
            <label for="first_name">First name</label>
            <input type="text" id="first_name" name="first_name" autocomplete="given-name" required />
          </div>
          <div class="field">
            <label for="last_name">Last name</label>
            <input type="text" id="last_name" name="last_name" autocomplete="family-name" />
          </div>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <div class="hint">At least 8 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Create account</button>
      </form>
      <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
      <p class="auth-alt">Looking for the Travel Advisor login? <a href="/advisor/login">Click here</a></p>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    redirectIfAuthed();

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Creating account…';

      const { ok, data } = await api('/api/auth/signup', {
        method: 'POST',
        body: {
          first_name: document.getElementById('first_name').value,
          last_name: document.getElementById('last_name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        },
      });

      if (ok) {
        const next = new URLSearchParams(location.search).get('next');
        window.location.href = next && next.startsWith('/') ? next : '/app';
      } else {
        showAlert(alertEl, 'error', data.message || 'Unable to create your account. Please try again.');
        btn.disabled = false; btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
