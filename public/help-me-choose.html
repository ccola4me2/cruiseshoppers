<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Help Me Choose a Cruise | Cruise Shoppers</title>
  <meta name="description" content="Not sure where to cruise? Answer a few quick questions and we'll recommend the best cruise destinations for you, then get personalized quotes from trusted advisors." />
  <link rel="canonical" href="https://cruiseshoppers.com/help-me-choose" />
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav">
        <a href="/cruises" class="hide-sm">Cruises</a>
        <a href="/specials">Specials</a>
        <a href="/login">Client log in</a>
        <a href="/signup" class="btn btn-primary" style="padding:9px 18px;">Sign up free</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width:720px;">
      <div class="how-eyebrow">Help me choose</div>
      <h1 style="font-family:var(--font-head);color:var(--navy);font-size:2.1rem;margin:0 0 8px;">Find your perfect cruise</h1>
      <p class="sub" style="margin:0 0 22px;">Answer a few quick questions and we'll point you to the cruises that fit you best. No account needed.</p>

      <div class="quiz-progress" id="progressWrap"><div class="quiz-progress-bar" id="progressBar"></div></div>
      <div id="quiz"></div>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script src="/js/help-me-choose.js"></script>

</html>
