<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cruise Specials | Cruise Shoppers</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header app-header">
    <div class="container bar">
      <a class="brand" href="/"><img src="/img/logo.png" alt="Cruise Shoppers" class="logo" /></a>
      <nav class="nav" id="accountNav"></nav>
    </div>
  </header>

  <main class="catalog">
    <div class="container">
      <div class="catalog-top">
        <div>
          <h1>Cruise specials</h1>
          <div class="count" id="count">Loading specials…</div>
        </div>
      </div>
      <p class="form-note">Featured deals from our travel advisors. Request a quote and the advisor who posted the special will follow up with pricing. No obligation.</p>
      <div id="results"><div class="state"><div class="spinner"></div>Loading specials…</div></div>
    </div>
  </main>

  <script src="/js/auth-client.js"></script>
  <script src="/js/specials.js"></script>
</body>
</html>
